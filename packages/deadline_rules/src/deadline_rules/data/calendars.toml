# calendars.toml -- jurisdiction calendars (weekend + dated holiday list) and the law -> calendar
# mapping.
#
# HOLIDAY SET AND AUTHORITY (see notes, "Holiday calendar -- Q1-Q5", 2026-09-08).
#
# The list below is the UNION of two independently operating chains, because a CPRA-style response
# deadline is reached by both and neither displaces the other:
#
#   Code Civ. Proc. § 12a  -- the operative extension statute. § 12a(a): the period "is hereby
#     extended to and including the next day that is not a holiday"; § 12a(b) reaches acts required
#     "whether expressed in this or any other code." Its "holiday" is defined as Saturdays + the
#     judicial holidays in Code Civ. Proc. § 135 + Code Civ. Proc. § 12b office closures -- it does
#     NOT reference Gov. Code § 6700. Parsons v. Estenson Logistics, LLC (2022) 86 Cal.App.5th 1260
#     applies § 12a to a substantive performance duty in another code and holds that an express
#     "calendar days" does not oust it. Ursino v. Superior Court (1974) 39 Cal.App.3d 611, 615 fn. 3
#     applies it to a public body's own duty to act, over a Saturday; endorsed in DeLeon v. Bay Area
#     Rapid Transit Dist. (1983) 33 Cal.3d 456.
#   Gov. Code § 6800     -- supplies the count (exclude the first day, include the last) and, via
#     Gov. Code § 6700, reaches three days that § 135 expressly excludes. Direction is forward:
#     Alford v. Industrial Acci. Com. (1946) 28 Cal.2d 198, 200. § 6800 CANNOT deliver Saturday --
#     Saturday is not a § 6700 holiday (People v. Pickens (1981) 124 Cal.App.3d 800).
#
# Encoding the union keeps ONE calendar correct for every law here. Gov. Code § 6700(a)(20)(B) makes
# MLK Day, Lunar New Year and Farmworkers Day inapplicable to "a city, county, or district" absent a
# local ordinance, which would otherwise force separate state and local calendars; § 135 carries no
# such carve-out, so those days are holidays for every agency on the § 12a chain.
#
# NO California case decides any of this for the CPRA. The chain is statutory text plus close
# analogues; an agency has a non-frivolous contrary argument (Harris v. Alcoholic Beverage Control
# Appeals Bd. (1963) 223 Cal.App.2d 563). See notes Q1(f).
#
# DELIBERATELY NOT ENCODED, each for a reason -- do not "complete" this list without reading Q2:
#   Lunar New Year (§ 6700(a)(4)) and Diwali (§ 6700(a)(9)) -- excluded from § 135, and no
#     authoritative multi-year dated series exists (CalHR publishes the statutory formula, not
#     dates). Computing a lunar date here would be inventing it. The engine under-rolls on these
#     two days for state agencies.
#   Good Friday (§ 6700(a)(19)) -- a holiday only "from 12 noon until 3 p.m."; § 135 takes only
#     "every full day" designated by § 6700, and is_business_day is all-or-nothing.
#   Governor/President proclaimed days (§ 6700(a)(20)(A)) -- not knowable in advance, and most are
#     § 6705 "special or limited" holidays on which public offices stay open. Thanksgiving IS
#     encoded: § 6700(a)(20)(B) carves it back in for everyone, 5 U.S.C. § 6103(a) fixes the date.
#   Code Civ. Proc. § 12b whole-day office closures -- real (campus winter closures, furlough days)
#     but per-agency and not computable; belongs in a future per-agency closure table.
#
# Gov. Code § 6701 ADDS days rather than moving them ("the Monday following IS a holiday"), and its
# subdivision (a) list is a CLOSED enumeration of seven dates never updated for Juneteenth or
# Genocide Remembrance Day -- a Sunday June 19 generates no Monday holiday. There is no general
# Saturday rule: a Saturday July 4 produces no Friday holiday (this bites in 2026).
#
# RANGE: 2012-01-01 .. 2030-12-31. 2012 is the earliest effective_from in rules.toml. Weekend dates
# are omitted -- weekend = [5, 6] already excludes them. Phase-ins are honoured, not backfilled:
# Native American Day from 2015, Juneteenth and Genocide Remembrance Day from 2023.
# *** THIS LIST EXPIRES. Extend it before 2030 or every date after it silently stops rolling. ***

